backend:
  name: github
  repo: alamerhh-arch/portfolio-website
  branch: content-editor
  auth_methods: [token]

media_folder: assets/uploads
public_folder: /portfolio-website/assets/uploads
publish_mode: simple
site_url: https://alamerhh-arch.github.io/portfolio-website/
display_url: https://alamerhh-arch.github.io/portfolio-website/
logo_url: /portfolio-website/favicon.svg

collections:
  - name: portfolio_content
    label: Portfolio Content
    files:
      - name: projects
        label: Projects
        file: content/projects.json
        format: json
        fields:
          - label: Projects
            name: projects
            widget: list
            summary: '{{fields.order}} — {{fields.title_en}}'
            fields:
              - { label: Slug, name: slug, widget: string, hint: 'Lowercase URL identifier; do not change after publishing.' }
              - { label: Order, name: order, widget: number, value_type: int, min: 1 }
              - { label: Published, name: published, widget: boolean, default: true }
              - { label: Show on homepage, name: home, widget: boolean, default: false }
              - { label: Featured case study, name: featured, widget: boolean, default: false }
              - { label: Case study pending, name: pending, widget: boolean, default: false }
              - { label: Title (English), name: title_en, widget: string }
              - { label: العنوان (العربية), name: title_ar, widget: string }
              - { label: Short homepage title (English), name: homeTitle_en, widget: string, required: false }
              - { label: العنوان المختصر (العربية), name: homeTitle_ar, widget: string, required: false }
              - { label: Card label (English), name: label_en, widget: string }
              - { label: تصنيف البطاقة (العربية), name: label_ar, widget: string }
              - { label: Category (English), name: category_en, widget: string }
              - { label: الفئة (العربية), name: category_ar, widget: string }
              - { label: Project type (English), name: type_en, widget: string }
              - { label: نوع المشروع (العربية), name: type_ar, widget: string }
              - { label: Role (English), name: role_en, widget: string }
              - { label: الدور (العربية), name: role_ar, widget: string }
              - { label: Scope (English), name: scope_en, widget: string }
              - { label: النطاق (العربية), name: scope_ar, widget: string }
              - { label: Stage (English), name: stage_en, widget: string }
              - { label: المرحلة (العربية), name: stage_ar, widget: string }
              - { label: Tools, name: tools, widget: string }
              - { label: Summary (English), name: summary_en, widget: text }
              - { label: الملخص (العربية), name: summary_ar, widget: text }
              - { label: Cover sheet number, name: cover, widget: number, value_type: int }
              - { label: Card image or logo, name: coverImage, widget: image }
              - { label: Detail page cover, name: detailCoverImage, widget: image }
              - { label: Logo, name: logo, widget: image, required: false }
              - { label: Card image width, name: coverWidth, widget: hidden, required: false }
              - { label: Card image height, name: coverHeight, widget: hidden, required: false }
              - { label: Detail image width, name: detailCoverWidth, widget: hidden, required: false }
              - { label: Detail image height, name: detailCoverHeight, widget: hidden, required: false }
              - label: Filters
                name: filters
                widget: select
                multiple: true
                options: [architecture, bim, residential, hospitality, industrial]
              - label: Video
                name: video
                widget: object
                required: false
                fields:
                  - { label: YouTube ID, name: id, widget: string }
                  - { label: Accessible title (English), name: title_en, widget: string }
                  - { label: العنوان الوصفي (العربية), name: title_ar, widget: string }
              - label: Gallery groups
                name: groups
                widget: list
                fields:
                  - { label: Group label (English), name: label_en, widget: string }
                  - { label: اسم المجموعة (العربية), name: label_ar, widget: string }
                  - label: Gallery images
                    name: images
                    widget: list
                    fields:
                      - { label: Image, name: src, widget: image }
                      - { label: Alternative text (English), name: alt_en, widget: string }
                      - { label: النص البديل (العربية), name: alt_ar, widget: string }
                      - { label: Width, name: width, widget: hidden, required: false }
                      - { label: Height, name: height, widget: hidden, required: false }

      - name: certificates
        label: Certificates
        file: content/certificates.json
        format: json
        fields:
          - label: Certificates
            name: certificates
            widget: list
            summary: '{{fields.order}} — {{fields.title_en}}'
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Order, name: order, widget: number, value_type: int, min: 1 }
              - { label: Published, name: published, widget: boolean, default: true }
              - { label: Featured on homepage, name: featured, widget: boolean, default: false }
              - { label: Title (English), name: title_en, widget: string }
              - { label: العنوان (العربية), name: title_ar, widget: string }
              - { label: Issuer (English), name: issuer_en, widget: string }
              - { label: الجهة (العربية), name: issuer_ar, widget: string }
              - { label: Group name (English), name: group_en, widget: string }
              - { label: اسم المجموعة (العربية), name: group_ar, widget: string }
              - label: Category
                name: category
                widget: select
                options:
                  - { label: Autodesk Training Center, value: autodesk }
                  - { label: BIM Solutions, value: bim-solutions }
                  - { label: Revizto, value: revizto }
                  - { label: Saudi Building Code, value: sbc }
              - { label: Certificate image, name: image, widget: image }
              - { label: Alternative text (English), name: alt_en, widget: string }
              - { label: النص البديل (العربية), name: alt_ar, widget: string }
              - { label: Width, name: width, widget: hidden, required: false }
              - { label: Height, name: height, widget: hidden, required: false }

      - name: site_settings
        label: Site settings and links
        file: content/site.json
        format: json
        fields:
          - label: Contact
            name: contact
            widget: object
            fields:
              - { label: Email, name: email, widget: string }
              - { label: Display phone, name: phone, widget: string }
              - { label: Phone link, name: phoneLink, widget: string }
              - { label: LinkedIn URL, name: linkedin, widget: string }
              - { label: CV PDF, name: cv, widget: file }
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: Site title (English), name: siteTitle_en, widget: string }
              - { label: عنوان الموقع (العربية), name: siteTitle_ar, widget: string }
              - { label: Description (English), name: description_en, widget: text }
              - { label: الوصف (العربية), name: description_ar, widget: text }

      - name: translations
        label: Arabic / English translations
        file: content/translations.json
        format: json
        fields:
          - label: Translations
            name: translations
            widget: list
            summary: '{{fields.english}}'
            fields:
              - { label: English text, name: english, widget: text }
              - { label: Arabic text, name: arabic, widget: text }
